services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: academia
      POSTGRES_USER: academia
      POSTGRES_PASSWORD: ${DB_PASSWORD:-academia123}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - academia_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academia -d academia"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  academia_pgdata:
